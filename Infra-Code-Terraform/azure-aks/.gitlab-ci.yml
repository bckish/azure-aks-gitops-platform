variables:
  TF_IN_AUTOMATION: "true"
  TF_ROOT: ${CI_PROJECT_DIR}
  ENV: variables
  TERRAFORM_ACTION: apply


before_script:
  - terraform --version
  - terraform init

stages:
  - validate
  - plan
  - action

Validating the Terraform Configuration:
  stage: validate
  tags:
    - aks
  script:
    - terraform validate
  

Running the Plan:
  stage: plan
  tags:
    - aks
  script:
    - test -n "$TF_VAR_aks_client_id" && test -n "$TF_VAR_aks_client_secret"
    - terraform plan -var-file="$ENV.tfvars"


Running the Apply:
  stage: action
  tags:
    - aks
  script:
    - if [[ "$TERRAFORM_ACTION" == "apply" ]]; then
        terraform apply -auto-approve -var-file="$ENV.tfvars";
      fi
  when: manual

  only:
    variables:
      - $TERRAFORM_ACTION == "apply"

Running the Destroy:
  stage: action
  tags:
    - aks
  script:
    - if [[ "$TERRAFORM_ACTION" == "destroy" ]]; then
        terraform destroy -auto-approve -var-file="$ENV.tfvars";
      fi
  when: manual
  
  only:
    variables:
      - $TERRAFORM_ACTION == "destroy"
