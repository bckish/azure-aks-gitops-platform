stages:
  - npm
  - code-analysis
  - file-scan
  - image-build
  - image-scan
  - dp-check
  - image-push

variables:
  DOCKER_DRIVER: overlay2
  CI_DEBUG_TRACE: "false"

Installing Dependency:
  stage: npm
  tags:
    - frontend
  script:
    - npm ci


# Checking Code Vulnerabilities
sonarqube-check:
  stage: code-analysis
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - sonar-scanner
  allow_failure: false
  only:
    - main

# File Scan using Trivy
Trivy file scan:
  stage: file-scan
  tags:
    - frontend
  before_script:
    - mkdir -p trivy-file-scan
  script: 
    - trivy fs . -o trivy-file-scan/trivy-file-scan-frontend:$CI_PIPELINE_IID.txt
  artifacts:
    untracked: false
    when: on_success
    expire_in: 30 days
    paths:
      - "trivy-file-scan"

# Docker Image Building
Image Building :
  stage: image-build
  tags:
    - frontend
  image:
    name: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $FRONTEND_ACR_USERNAME/frontend:$CI_PIPELINE_IID .

# ACR Image Scanning
Image Scaning using Trivy:
  stage: image-scan
  tags:
    - frontend
  before_script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  script:
    - mkdir -p trivy-image-scan
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $FRONTEND_ACR_USERNAME/frontend:$CI_PIPELINE_IID -o trivy-image-scan/trivy-image-scan-frontend:$CI_PIPELINE_IID.txt
  artifacts:
    untracked: false
    when: on_success
    expire_in: 30 days
    paths:
      - "trivy-image-scan/"

# Dependency Check Running:
DP-Check:
  stage: dp-check
  image:
    name: owasp/dependency-check
    entrypoint: [""]
  script:
    - /usr/share/dependency-check/bin/dependency-check.sh --scan . --disableNodeAudit
  artifacts:
    untracked: false
    when: on_success
    expire_in: 30 days
    paths:
      - "/reports/dependency-check"


# Pushing Image to ACR
Image Pushing to ACR:
  stage: image-push
  tags:
    - frontend
  image:
    name: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$FRONTEND_ACR_PASSWORD" | docker login $FRONTEND_ACR_USERNAME -u $FRONTEND_ACR_REGISTRY --password-stdin
  script: 
    - docker push $FRONTEND_ACR_USERNAME/frontend:$CI_PIPELINE_IID
    - docker rmi -f $FRONTEND_ACR_USERNAME/frontend:$CI_PIPELINE_IID
  when: manual
