name: Local application validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        working-directory: Source-Code-Build/backend
        run: npm ci && npm audit --audit-level=high && NODE_OPTIONS=--throw-deprecation npm test
      - name: Frontend build
        working-directory: Source-Code-Build/frontend
        run: npm ci && npm audit --audit-level=high && npm run build
